title: MD.cff — Metadata Format for FDO Squirrel
description: Specification of MD.cff, the metadata format read by fdo-squirrel to build FAIR Digital Objects.
url: "https://fdox-squirrel.github.io/fdo-squirrel-spec/"

github:
  private: false
  license:
    name: MIT
  source:
    branch: "main"
    path: "/"
  repository_url: "https://github.com/FDOx-squirrel/fdo-squirrel-spec"

defaults:
  - scope:
      path: "**/*.*"
    values:
      sitemap: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
